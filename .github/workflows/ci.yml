name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# R-7a, SB-8, SB-15: a test whose prerequisite is missing (python3, a C compiler, a machine for
# which native executables are made, rustc) fails here instead of passing without running its
# body (`missing_prerequisite` in compiler/unio/tests/common.rs). The jobs that run the tests
# install the prerequisites in the step "Prerequisites of the tests".
env:
  UNIO_REQUIRE_PREREQUISITES: "1"

# Plan section 12, release condition 3: every job runs on a named image, not on a -latest label
# that moves to another system, and the jobs that build or link select the C compiler, linker,
# and SDK pinned in .github/scripts/expected_toolchain.py (compiler/README.md, "Pinned linkers
# and SDKs"); the jobs `release`, `install`, and `native-linux-arm` check the record of
# `unio build --print-toolchain` against the pins.

jobs:
  spec:
    name: grammar and documentation
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/expected_toolchain.py select
      # The checks are the Unio tools of tools/, run by the interpreter of sprint S5
      # (docs/runtime.md 8.3). The Python checkers stay as the reference: the job
      # python-parity compares them, and bench/ uses them in performance comparisons.
      # Inside compiler/, so that rustup uses the toolchain of compiler/rust-toolchain.toml:
      # rustup finds it from the working directory, not from --manifest-path.
      - name: Build the interpreter
        working-directory: compiler
        run: cargo build --release --locked -p unio
      - name: Documentation formatting and links
        run: compiler/target/release/unio run tools/check_docs.unio
      - name: Grammar consistency and corpus
        run: compiler/target/release/unio run tools/check_grammar.unio -- --corpus
      - name: Unio sources parse (reference programs, standard library, tools)
        run: compiler/target/release/unio run tools/check_grammar.unio -- docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio
      - name: Unio sources use only the standard library API
        run: compiler/target/release/unio run tools/check_api.unio
      # T-5b: a grammar rule without a valid and an invalid corpus file, or a code of the
      # catalog without a control program, fails the run unless its exemption is documented.
      - name: Every grammar rule has corpus files and every code a control program (T-5b)
        run: compiler/target/release/unio run tools/check_coverage.unio
      - name: Unio test blocks (stdlib, examples, tools)
        run: compiler/target/release/unio test docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio
      # D-1, D-3: docs/stdlib-reference.md and its Russian twin are generated from the documentation
      # comments of stdlib/, and docs/reference.md names every grammar rule and catalog code.
      - name: Generated references are up to date
        run: compiler/target/release/unio run tools/reference.unio -- --check
      # Plan section 12, release condition 4: the notices list the crates of Cargo.lock that
      # the shipped unio and libunio.a contain. The list is the same on every system.
      - name: Third-party notices are up to date
        if: runner.os == 'Linux'
        run: python3 .github/scripts/third_party_notices.py --check

  python-parity:
    # The Python checkers are kept as the reference for parity and benchmarks (AGENTS.md,
    # plan section 12): the Unio tools must give their results on every change.
    name: Unio tools agree with the Python checkers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/expected_toolchain.py select
      - name: Compare every check
        working-directory: compiler
        run: cargo test --release -p unio --test tools -- --ignored

  benchmarks:
    # Requirement 7.1: Unio at least 0.5x of CPython 3.13 (bench/README.md). The native
    # executables of `unio build` (sprint S6) meet the floor on all four benchmarks; JSON is
    # still below it in the interpreter, so that step reports without failing the run.
    name: benchmarks against Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/expected_toolchain.py select
      - name: Build the interpreter
        working-directory: compiler
        run: cargo build --release --locked -p unio
      - name: Text benchmarks meet the floor
        run: python3 bench/run.py --runs 3 --only wc,text,loop --check-floor
      - name: JSON benchmark in the interpreter (below the floor, not yet enforced)
        continue-on-error: true
        run: python3 bench/run.py --runs 1 --only json --check-floor --json bench/results-json.json
      - name: Native executables meet the floor (wc, json, text, loop)
        run: python3 bench/run.py --runs 5 --only wc,json,text,loop --native --check-floor --json bench/results-native.json
      # Requirement 7.1: the native executable of an empty program starts within 5 ms. A start
      # takes a few milliseconds and shared runners are noisy, so the check compares the median
      # of 101 runs, timed by the launcher from its fork to the end of the program.
      - name: Native start-up of an empty program at most 5 ms (7.1)
        run: python3 bench/run.py --only empty --native --check-startup --json bench/results-startup.json
      # RFC 0007 and requirement 7.1: freeing about 100 MB at once takes at most 1 ms per MB of
      # peak memory (median of 7 runs), in the interpreter and natively; bench/free/.
      - name: Pause of freeing a structure at once (RFC 0007)
        run: python3 bench/run.py --only free --native --check-free --json bench/results-free.json
      # RFC 0003: native time and peak memory against Go, blocking for the benchmarks gated
      # for 0.1 (wc and loop); json and text are measured and printed but do not fail the step
      # (gated from 0.2). Each language's time is the best of 9 runs, which a slow run on a
      # shared runner does not move; peak memory is the smallest of the runs.
      - name: Native executables against Go (RFC 0003; wc and loop gated)
        run: python3 bench/run.py --runs 9 --only wc,json,text,loop --native --check-go --json bench/results-go.json
      # Requirement 7.1: `unio check` of a 10,000-line package at most 1 s and a full
      # `unio build --release` of it at most 30 s, the median of 5 runs each; the package is
      # generated by bench/package/generate.py, and every build starts without its cache.
      - name: Check and release build of a 10,000-line package (7.1)
        run: python3 bench/run.py --only package --check-compile --json bench/results-package.json
      # Requirement L-11b: the cost of copies. A change in place or of one level must not cost
      # more with the size of what it does not change (at most 3x at ten times the size, median
      # of 5 runs), in the interpreter and natively; the cost per element of a full copy is
      # recorded in the results.
      - name: Cost of copies of values (L-11b)
        run: python3 bench/run.py --only copies --native --check-copies --json bench/results-copies.json
      - name: Keep the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results*.json
          if-no-files-found: warn

  editors:
    name: editor highlighting
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # T-11: the session with `unio lsp` (test/client.test.mjs) and the run of `unio test` by the
      # Testing view (test/testing.test.mjs) need a `unio` built from this checkout in
      # compiler/target; under UNIO_REQUIRE_PREREQUISITES=1 they fail without it, not skip.
      - name: The pinned Rust toolchain (compiler/rust-toolchain.toml)
        shell: bash
        run: sh ../../.github/scripts/pinned_toolchain.sh
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" ../../.github/scripts/expected_toolchain.py select
      - name: Build unio for the tests of the language server and the Testing view
        working-directory: compiler
        run: cargo build --release --locked -p unio
      - name: Install the TextMate engine for the tests
        run: npm ci
      - name: Grammar, language server, and Testing view tests (with unio lsp and unio test)
        run: npm test
      - name: Build the VS Code and Cursor package
        run: npx --yes @vscode/vsce@4.1.0 package --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: unio-vscode-extension
          path: editors/vscode/*.vsix

  native-linux-arm:
    # The fourth platform (docs/runtime.md 8.4, R-8): the code generation tests of every target,
    # the native suite, the sandbox suites SB-8 and SB-15 (R-7a), every test of both crates, and
    # every Unio test block, run on an AArch64 runner.
    name: native executables and all tests on Linux AArch64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      # rustup alone: the toolchain itself is the one compiler/rust-toolchain.toml pins, which
      # the next step installs and checks, as on every runner.
      - name: Rust toolchain, when the runner image has none
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: The pinned Rust toolchain (compiler/rust-toolchain.toml)
        shell: bash
        run: sh ../.github/scripts/pinned_toolchain.sh
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" ../.github/scripts/expected_toolchain.py select
      # The prerequisites of the tests under UNIO_REQUIRE_PREREQUISITES=1: python3 for the
      # tests of leaving the process group, and the C compiler that the pin selected above
      # (CC on Linux, the pinned Xcode on macOS, MSVC on Windows) for the C helpers and the link.
      - name: Prerequisites of the tests (python3, a C compiler)
        shell: bash
        run: |
          set -eu
          python=$(command -v python3 || command -v python)
          "$python" --version
          if [ "$RUNNER_OS" != Windows ]; then
            command -v python3
            "${CC:-cc}" --version
          fi
      - name: Code generation for every target
        run: cargo test --release -p unio --lib 'native::'
      - name: Native executables give the output of unio run, builds are deterministic (C-4, C-5)
        run: cargo test --release -p unio --test native
      - name: The linker and SDK are the pinned ones
        run: python3 ../.github/scripts/expected_toolchain.py check target/release/unio
      # unio build --target (table 6.1; docs/tools.md section 10): Linux AArch64 for x86-64.
      - name: Cross build for the other Linux target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-x86-64-linux-gnu qemu-user
          # qemu-user looks for the target's dynamic loader under this prefix.
          export QEMU_LD_PREFIX=/usr/x86_64-linux-gnu
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --locked -p unio --lib --target x86_64-unknown-linux-gnu
          UNIO_TEST_CROSS=1 cargo test --release -p unio --test cross
      # R-7a: the job `release` needs this job, so no release is built while a test of SB-8 or
      # SB-15 fails here.
      - name: Sandbox suites SB-8 and SB-15 (R-7a)
        run: |
          cargo test -p unio --test sandbox --test workers --test packages
          cargo test -p unio-runtime --test writer --test process --test process_windows
      # R-8: every test on every platform, as the jobs `compiler` and `spec` run them on the others.
      - name: Tests (corpus, all .unio sources, diagnostics, mutation)
        run: cargo test
      - name: Unio test blocks (stdlib, examples, tools)
        shell: bash
        working-directory: .
        run: |
          (cd compiler && cargo build --release --locked -p unio)
          compiler/target/release/unio test docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio

  power-cut:
    # S-9b, C-19 (docs/runtime.md 10.5): the block writes of ext4 and XFS are recorded with the
    # device-mapper target log-writes while Unio programs write atomic files, and every prefix
    # of the log is replayed, mounted (journal recovery), and checked. The trial needs root:
    # hosted Ubuntu runners give passwordless sudo, and dm-log-writes ships in the kernel's
    # linux-modules-extra package. The same trial then runs with the FUSE recorder of the test,
    # which is what runs where the kernel has no device mapper.
    name: power cut replayed from block writes (Linux x86-64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Rust toolchain (compiler/rust-toolchain.toml)
        shell: bash
        run: sh ../.github/scripts/pinned_toolchain.sh
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" ../.github/scripts/expected_toolchain.py select
      - name: Device mapper, dm-log-writes, XFS tools
        id: dm
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y dmsetup xfsprogs e2fsprogs
          # dm-log-writes ships in linux-modules-extra, which is not published for every kernel
          # of the runner image (none for 7.0.0-1017-azure, run 43446501062). Without it the
          # dm-log-writes trial cannot run; that is reported, not passed over in silence.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe dm-log-writes && sudo dmsetup targets | grep -qw log-writes; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::dm-log-writes is not available for kernel $(uname -r): only the FUSE recorder runs; the dm-log-writes evidence of S-9b is still pending"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          sudo modprobe xfs
          sudo modprobe fuse
          sudo modprobe loop
      - name: Build the trial
        shell: bash
        run: |
          set -eu
          cargo test --release --locked -p unio --test power_cut --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "power_cut") | .executable' \
            > "$RUNNER_TEMP/power_cut"
          test -x "$(cat "$RUNNER_TEMP/power_cut")"
      - name: The log reader and the content check (no root)
        run: cargo test --release --locked -p unio --test power_cut
      - name: Power cut at every write logged by dm-log-writes (ext4, xfs)
        if: steps.dm.outputs.available == 'true'
        shell: bash
        run: |
          sudo env UNIO_POWER_CUT=dm-log-writes UNIO_POWER_CUT_FS=ext4,xfs \
            "$(cat "$RUNNER_TEMP/power_cut")" --ignored --nocapture --test-threads=1
      - name: The same trial with the FUSE recorder (ext4, xfs)
        shell: bash
        run: |
          sudo env UNIO_POWER_CUT=fuse UNIO_POWER_CUT_FS=ext4,xfs \
            "$(cat "$RUNNER_TEMP/power_cut")" --ignored --nocapture --test-threads=1

  compiler:
    name: compiler front end
    strategy:
      # A failure on one system does not cancel the others: each reports its own result.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Rust toolchain (compiler/rust-toolchain.toml)
        shell: bash
        run: sh ../.github/scripts/pinned_toolchain.sh
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" ../.github/scripts/expected_toolchain.py select
      # The prerequisites of the tests under UNIO_REQUIRE_PREREQUISITES=1: python3 for the
      # tests of leaving the process group, and the C compiler that the pin selected above
      # (CC on Linux, the pinned Xcode on macOS, MSVC on Windows) for the C helpers and the link.
      - uses: actions/setup-python@v5
        # Only on Windows, which has no python3 of the system. Elsewhere the tests use the
        # system's python3: the sandbox grants reads of the system directories, not of the
        # runner's tool cache, so a python3 from setup-python cannot load its library there.
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - name: Prerequisites of the tests (python3, a C compiler)
        shell: bash
        run: |
          set -eu
          python=$(command -v python3 || command -v python)
          "$python" --version
          if [ "$RUNNER_OS" != Windows ]; then
            command -v python3
            "${CC:-cc}" --version
          fi
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      # R-7a: the job `release` needs this job, so no release is built while a test of SB-8 or
      # SB-15 fails on Linux x86-64, macOS, or Windows (Linux AArch64: job native-linux-arm).
      - name: Sandbox suites SB-8 and SB-15 (R-7a)
        run: |
          cargo test -p unio --test sandbox --test workers --test packages
          cargo test -p unio-runtime --test writer --test process --test process_windows
      - name: Tests (corpus, all .unio sources, diagnostics, mutation)
        run: cargo test
      - name: Formatter speed (T-3, release build)
        run: cargo test --release --test format thousand
      # Check A of R-10 (plan section 12, condition 2), with the full sandbox on every system.
      - name: Control set yields the expected diagnostics (R-10)
        run: cargo test --release -p unio --test control
      # Linux x86-64, macOS on AArch64 (macos-26), Windows x86-64 with the pinned MSVC toolset
      # and Windows SDK (docs/runtime.md 8.4); Linux AArch64 in native-linux-arm.
      - name: Native executables give the output of unio run, builds are deterministic (C-4, C-5)
        run: cargo test --release -p unio --test native
      # unio build --target (table 6.1; docs/tools.md section 10): Linux x86-64 for AArch64.
      - name: Cross build for the other Linux target
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          # qemu-user looks for the target's dynamic loader under this prefix.
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --locked -p unio --lib --target aarch64-unknown-linux-gnu
          UNIO_TEST_CROSS=1 cargo test --release -p unio --test cross
      - name: Seatbelt denials, when the tests or the native link step fail on macOS
        if: failure() && runner.os == 'macOS'
        run: log show --last 10m --style compact --predicate 'sender == "Sandbox"' | tail -80
      - name: Unio sources are in the one style (docs/style.md)
        shell: bash
        working-directory: .
        run: |
          (cd compiler && cargo build --release --locked)
          compiler/target/release/unio fmt --check docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio spec/tests/valid/*.unio
      - name: Unio sources pass name and type checks (docs/semantics.md)
        shell: bash
        working-directory: .
        run: compiler/target/release/unio check docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio spec/tests/semantic/valid/*.unio

  release:
    # Plan section 12, release condition 1: the release build in the installed layout of
    # .github/scripts/release_build.sh, kept for the jobs below: `install` runs it where there is
    # no checkout, and `reproducible` builds it again elsewhere and compares the bytes. Every
    # platform where 0.1 ships (R-8): Linux x86-64, Linux arm64, macOS arm64, Windows x86-64.
    name: release build
    # R-7a: no release while a test of the sandbox suites SB-8 and SB-15 fails on any of the four
    # platforms (the jobs `compiler` and `native-linux-arm` run them), and R-8: no release while
    # any test of either job fails.
    needs: [compiler, native-linux-arm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # rustup alone, when the image has none (ubuntu-24.04-arm), as in native-linux-arm.
      - name: Rust toolchain, when the runner image has none
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: The pinned Rust toolchain (compiler/rust-toolchain.toml)
        run: sh .github/scripts/pinned_toolchain.sh
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/expected_toolchain.py select
      - name: Release build in the installed layout
        run: sh .github/scripts/release_build.sh "$RUNNER_TEMP/unio-install"
      # Plan section 12, release condition 3: the identity of the linker and the SDK that the
      # release records in every executable is the pinned one; on a mismatch the step says how
      # to update the pin deliberately.
      - name: The linker and SDK are the pinned ones
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/expected_toolchain.py check "$RUNNER_TEMP/unio-install/bin/unio"
      # R-6, R-6a: the SBOM (CycloneDX, from Cargo.lock) and the signed manifest of the release.
      # The release key is the operator's, kept offline and never given to CI
      # (docs/cryptography.md, section 4); CI signs with a key made for this run only and
      # verifies the result, which checks the path, not the release. The operator verifies the
      # artifacts and the reproducible build, then signs them with the release key.
      - name: SBOM and a release manifest signed with a key of this run (not the release key)
        run: |
          set -eu
          prefix="$RUNNER_TEMP/unio-install"
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/sbom.py "$prefix/share/doc/unio/sbom.cdx.json"
          unio="$prefix/bin/unio"
          "$unio" key new ci-run --dir "$RUNNER_TEMP/ci-run-key"
          cd "$prefix"
          files=$(find bin lib share -type f | sort)
          subject="unio-${{ runner.os }}-${{ runner.arch }}-ci-run-${{ github.run_id }}"
          "$unio" release sign --key "$RUNNER_TEMP/ci-run-key/ci-run.key" --subject "$subject" --sequence "${{ github.run_number }}" --out RELEASE-CI-TEST $files
          "$unio" release verify RELEASE-CI-TEST --public "$RUNNER_TEMP/ci-run-key/ci-run.pub" --subject "$subject"
          cp "$RUNNER_TEMP/ci-run-key/ci-run.pub" RELEASE-CI-TEST.pub
          rm -rf "$RUNNER_TEMP/ci-run-key"
      # Plan section 12, release condition 2, on Windows: without /Brepro link.exe writes the
      # link time into unio.exe (.github/scripts/release_build.sh; tests/release_build.rs).
      - name: The release flags pass /Brepro to link.exe
        if: runner.os == 'Windows'
        run: |
          flags=$(sh .github/scripts/release_build.sh --print-rustflags)
          echo "RUSTFLAGS of the release build: $flags"
          case " $flags " in
            *" -C link-arg=-Brepro "*) ;;
            *) echo "::error::the release build of Windows does not pass /Brepro to link.exe"; exit 1 ;;
          esac
      # For the job `reproducible`, on every platform.
      - name: Executable of a reference program and the hashes of the build
        run: |
          # sha256sum of Git Bash marks binary files with *: one format on every system.
          sum256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi | sed 's/ \*/  /'; }
          x=; lib=libunio.a
          if [ "$RUNNER_OS" = Windows ]; then x=.exe; lib=unio.lib; fi
          mkdir -p "$RUNNER_TEMP/probe"
          cp examples/wc.unio "$RUNNER_TEMP/probe/"
          # wc reads the files it is given: a program without a manifest may not (SB-7).
          printf '[package]\nname = "wc"\nversion = "0.1.0"\n\n[permissions]\nfiles.read = ["$CWD/**"]\n' > "$RUNNER_TEMP/probe/unio.toml"
          cd "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/unio-install/bin/unio" build --release wc.unio -o "wc$x"
          "$RUNNER_TEMP/unio-install/bin/unio" build --print-toolchain > "$RUNNER_TEMP/unio-install/TOOLCHAIN"
          cd "$RUNNER_TEMP/unio-install"
          sum256 "bin/unio$x" "lib/unio/$lib" "../probe/wc$x" | sed 's# \.\./probe/# probe/#' > SHA256SUMS
          cat TOOLCHAIN SHA256SUMS
      # One artifact per platform: unio-Linux-X64, unio-Linux-ARM64, unio-macOS-ARM64,
      # unio-Windows-X64.
      - uses: actions/upload-artifact@v4
        with:
          name: unio-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/unio-install
          if-no-files-found: error
      # The pins for the job `install`, which has no checkout: one copy, from Linux x86-64.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && runner.arch == 'X64'
        with:
          name: toolchain-pins
          path: .github/scripts/expected_toolchain.py
          if-no-files-found: error

  install:
    # Plan section 12, release condition 1: the installed unio, with no checkout of the
    # repository on the machine and no variable of Unio, checks, formats, runs, tests, and
    # builds a program written in an empty directory, and the executable runs, under the full
    # sandbox of every system, on Windows its AppContainer (SB-5, SB-10).
    name: installed unio
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unio-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/prefix
      # The pins alone, not a checkout: the same linker and SDK as in the job `release`.
      - uses: actions/download-artifact@v4
        with:
          name: toolchain-pins
          path: ${{ runner.temp }}/pins
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" "$RUNNER_TEMP/pins/expected_toolchain.py" select
      - name: Installed unio works without the source tree
        working-directory: ${{ runner.temp }}
        run: |
          set -eux
          unset UNIO_STDLIB UNIO_POLICY UNIO_RUNTIME_LIB
          chmod +x prefix/bin/unio* || true
          # No checkout: this job never checks the repository out.
          test ! -e "$GITHUB_WORKSPACE/stdlib"
          export PATH="$PWD/prefix/bin:$PATH"
          mkdir work && cd work
          printf '%s\n' \
            '## The program of the installation check: it greets with a sum.' \
            '' \
            'import std.args' \
            '' \
            'function total(values as List[Int]) returns Int:' \
            '    var sum = 0' \
            '    for value in values:' \
            '        sum = sum + value' \
            '    return sum' \
            '' \
            'public function main() returns Int:' \
            '    print("hello {total([1, 2, 3])} {args.list().length()}")' \
            '    return 0' \
            '' \
            'test "the total of three numbers":' \
            '    assert total([1, 2, 3]) == 6' > hello.unio
          unio check hello.unio
          unio fmt --check hello.unio
          test "$(unio run hello.unio -- a b | tr -d '\r')" = "hello 6 2"
          unio test hello.unio | tee test.out
          grep -F "the total of three numbers" test.out
          unio symbol std.args.list | tee symbol.out
          grep -F "declared: <unio>/stdlib" symbol.out
          exe=hello
          if [ "$RUNNER_OS" = Windows ]; then exe=hello.exe; fi
          unio build --release hello.unio -o "$exe"
          test "$(./$exe x | tr -d '\r')" = "hello 6 1"
      - name: The linker and SDK are the pinned ones
        run: |
          python=$(command -v python3 || command -v python)
          "$python" "$RUNNER_TEMP/pins/expected_toolchain.py" check "$RUNNER_TEMP/prefix/bin/unio"

  reproducible:
    # Plan section 12, release condition 2: a second runner of the same image builds the release
    # again from the same commit and lock file, in another directory and with another
    # CARGO_HOME, and the bytes of unio, libunio.a, and an executable of `unio build` are
    # compared with those of the job `release` on the same platform (C-4, R-6), on every
    # platform where 0.1 ships. On Windows release_build.sh links unio.exe with /Brepro, so
    # that the PE header and the debug directory hold a hash of the content and not the link
    # time; the PDB stays in target/ and is not part of the release.
    name: independent reproducible build
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: elsewhere/checkout
      - uses: actions/download-artifact@v4
        with:
          name: unio-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/first
      # rustup alone, when the image has none (ubuntu-24.04-arm), as in native-linux-arm.
      - name: Rust toolchain, when the runner image has none
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: The pinned Rust toolchain (compiler/rust-toolchain.toml)
        run: sh elsewhere/checkout/.github/scripts/pinned_toolchain.sh
      - name: The pinned linker and SDK (.github/scripts/expected_toolchain.py)
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" elsewhere/checkout/.github/scripts/expected_toolchain.py select
      - name: The release built again in another directory, with another CARGO_HOME
        run: |
          # sha256sum of Git Bash marks binary files with *: one format on every system.
          sum256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi | sed 's/ \*/  /'; }
          x=; lib=libunio.a
          if [ "$RUNNER_OS" = Windows ]; then x=.exe; lib=unio.lib; fi
          mkdir -p "$RUNNER_TEMP/cargo-home"
          CARGO_HOME="$RUNNER_TEMP/cargo-home" sh elsewhere/checkout/.github/scripts/release_build.sh "$RUNNER_TEMP/second"
          mkdir -p "$RUNNER_TEMP/probe-second/a/b"
          cp elsewhere/checkout/examples/wc.unio "$RUNNER_TEMP/probe-second/a/b/"
          printf '[package]\nname = "wc"\nversion = "0.1.0"\n\n[permissions]\nfiles.read = ["$CWD/**"]\n' > "$RUNNER_TEMP/probe-second/a/b/unio.toml"
          cd "$RUNNER_TEMP/probe-second/a/b"
          "$RUNNER_TEMP/second/bin/unio" build --release wc.unio -o "wc$x"
          "$RUNNER_TEMP/second/bin/unio" build --print-toolchain > "$RUNNER_TEMP/second/TOOLCHAIN"
          cd "$RUNNER_TEMP/second"
          sum256 "bin/unio$x" "lib/unio/$lib" "../probe-second/a/b/wc$x" | sed 's# \.\./probe-second/a/b/# probe/#' > SHA256SUMS
      # Both runners share the home directory and the image, so a path of either that reached
      # the artifacts the same way on both would not show in the comparison: look for them.
      # One prefix is not of this machine: the compiler_builtins that rustup ships for macOS was
      # built by the Rust project's CI in /Users/runner/work/rust/rust, which the macos runner's
      # home happens to begin (run 43415324553). Those strings are the same bytes on every
      # machine, so they are left out; any other match fails.
      - name: No path of the build machine in unio, the runtime library, or the executable
        run: |
          set -eu
          x=; lib=libunio.a
          if [ "$RUNNER_OS" = Windows ]; then x=.exe; lib=unio.lib; fi
          files="$RUNNER_TEMP/second/bin/unio$x $RUNNER_TEMP/second/lib/unio/$lib $RUNNER_TEMP/probe-second/a/b/wc$x"
          set -- "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then
            for path in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
              set -- "$@" "$(cygpath -w "$path")" "$(cygpath -m "$path")"
            done
          fi
          found=0
          for needle in "$@"; do
            for file in $files; do
              if LC_ALL=C tr -c '[:print:]' '\n' < "$file" | grep -i -F -e "$needle" | grep -v -F -e /work/rust/rust/ | grep -q .; then
                echo "::error::$file holds the path $needle"
              # The strings that hold it, so that the source of the path can be found.
              if command -v strings >/dev/null; then strings -a "$file" | grep -i -F -e "$needle" | grep -v -F -e /work/rust/rust/ | sort | uniq -c | sort -rn | head -20; fi
                found=1
              fi
            done
          done
          exit "$found"
      - name: Two builds on two runners give the same bytes (unio, libunio.a, an executable)
        run: |
          cd "$RUNNER_TEMP"
          echo "first runner:";  cat first/TOOLCHAIN first/SHA256SUMS
          echo "second runner:"; cat second/TOOLCHAIN second/SHA256SUMS
          diff first/TOOLCHAIN second/TOOLCHAIN
          if ! diff first/SHA256SUMS second/SHA256SUMS; then
            # What differs, so that the source of the difference can be found from the log.
            for f in bin/unio lib/unio/libunio.a bin/unio.exe; do
              [ -f "first/$f" ] && [ -f "second/$f" ] || continue
              cmp -s "first/$f" "second/$f" && continue
              echo "== $f: $(cmp -l "first/$f" "second/$f" | wc -l) bytes differ"
              cmp -l "first/$f" "second/$f" | head -5
              if command -v otool >/dev/null; then
                diff <(otool -l "first/$f") <(otool -l "second/$f") | head -20
              fi
              if command -v strings >/dev/null; then
                diff <(strings -a "first/$f" | sort -u) <(strings -a "second/$f" | sort -u) | head -40
              fi
            done
            exit 1
          fi
