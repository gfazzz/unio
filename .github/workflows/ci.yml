name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: grammar and documentation
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Windows has no sandbox of the operating system yet, so the programs would not start
      # there (SB-5); CI, as the operator, allows the weaker sandbox on Windows only.
      SANDBOX: ${{ matrix.os == 'windows-latest' && '--allow-weaker-sandbox' || '' }}
    steps:
      - uses: actions/checkout@v4
      # The checks are the Unio tools of tools/, run by the interpreter of sprint S5
      # (docs/runtime.md 8.3); they replaced the temporary Python checkers.
      - name: Build the interpreter
        run: cargo build --release --manifest-path compiler/Cargo.toml -p unio
      - name: Documentation formatting and links
        run: compiler/target/release/unio run $SANDBOX tools/check_docs.unio
      - name: Grammar consistency and corpus
        run: compiler/target/release/unio run $SANDBOX tools/check_grammar.unio -- --corpus
      - name: Unio sources parse (reference programs, standard library, tools)
        run: compiler/target/release/unio run $SANDBOX tools/check_grammar.unio -- docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio
      - name: Unio sources use only the standard library API
        run: compiler/target/release/unio run $SANDBOX tools/check_api.unio
      - name: Unio test blocks (stdlib, examples, tools)
        run: compiler/target/release/unio test $SANDBOX docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio

  python-parity:
    # Until the Python checkers are deleted, the Unio tools must give their results
    # (AGENTS.md); this job and compiler/unio/tests/tools.rs go away with them.
    name: Unio tools agree with the Python checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare every check
        working-directory: compiler
        run: cargo test --release -p unio --test tools -- --ignored

  benchmarks:
    # Requirement 7.1: Unio at least 0.5x of CPython 3.13 (bench/README.md). JSON is still
    # below the floor in the interpreter, so its step reports without failing the run until
    # native code (sprint S6) or a faster interpreter brings it above 0.5x.
    name: benchmarks against Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the interpreter
        run: cargo build --release --manifest-path compiler/Cargo.toml -p unio
      - name: Text benchmarks meet the floor
        run: python3 bench/run.py --runs 3 --only wc,text,loop --check-floor
      - name: JSON benchmark (below the floor, not yet enforced)
        continue-on-error: true
        run: python3 bench/run.py --runs 1 --only json --check-floor --json bench/results-json.json

  editors:
    name: editor highlighting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the TextMate engine for the tests
        run: npm ci
      - name: Grammar tests (keywords from spec/grammar.ebnf, all .unio files)
        run: npm test
      - name: Build the VS Code and Cursor package
        run: npx --yes @vscode/vsce@4.1.0 package --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: unio-vscode-extension
          path: editors/vscode/*.vsix

  compiler:
    name: compiler front end
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (corpus, all .unio sources, diagnostics, mutation)
        run: cargo test
      - name: Formatter speed (T-3, release build)
        run: cargo test --release --test format thousand
      - name: Unio sources are in the one style (docs/style.md)
        shell: bash
        working-directory: .
        run: |
          cargo build --release --manifest-path compiler/Cargo.toml
          compiler/target/release/unio fmt --check docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio spec/tests/valid/*.unio
      - name: Unio sources pass name and type checks (docs/semantics.md)
        shell: bash
        working-directory: .
        run: compiler/target/release/unio check docs/examples/*.unio docs/ru/examples/*.unio examples/*.unio $(find stdlib -name '*.unio') tools/*.unio spec/tests/semantic/valid/*.unio
