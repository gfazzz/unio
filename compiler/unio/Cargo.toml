[package]
name = "unio"
version = "0.1.0-dev"
edition = "2021"
description = "The Unio compiler: front end (lexer, parser, diagnostics)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
# The static library is the runtime that `unio build` links into every executable (C-5,
# docs/runtime.md 8.4): the value model, the externals, the sandbox, and the support functions
# that native code calls.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "unio"
path = "src/main.rs"

[dependencies]
unio-runtime = { path = "../unio-runtime" }
# The code generator of `unio build` (requirements, section 10). Exact versions, so that builds
# are reproducible (C-4); updates are deliberate, with Cargo.lock.
cranelift-codegen = { version = "=0.137.1", default-features = false, features = ["std", "x86", "arm64"] }
cranelift-frontend = { version = "=0.137.1", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.137.1", default-features = false, features = ["std"] }
cranelift-object = { version = "=0.137.1", default-features = false }
# ML-DSA-65 (FIPS 204) for the signatures of packages, registries, and releases (T-8, T-8a, R-6a;
# docs/cryptography.md). The one vetted implementation, pure Rust, exact version; no default
# features: no random number generator (keys are made from a seed the tool reads from the
# system), no PKCS#8; `zeroize` clears key material when it is dropped. compiler/README.md.
ml-dsa = { version = "=0.1.2", default-features = false, features = ["zeroize"] }

# On Windows `unio build` links with `link.exe` of Visual Studio, found as rustc finds it
# (docs/runtime.md 8.4). No dependencies of its own; an exact version, as above (C-4).
# Tests only, never in unio or libunio.a: an independent implementation of ML-DSA (FIPS 204)
# and of SHA-384 (FIPS 180-4), to check interoperability (docs/cryptography.md, section 5).
[dev-dependencies]
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-65"] }
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "=0.1.15"
